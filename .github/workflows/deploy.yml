name: Deploy to Aliyun

on:
  push:
    branches:
      - feature-web2   # 需要改部署分支时改这里（如 main / master）
  workflow_dispatch:   # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 把 dist/ 推到服务器部署目录（rsync 只传变化部分）
      - name: Sync dist to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /www/pakfront/dist
          remote_host: ${{ secrets.ALIYUN_HOST }}
          remote_user: ${{ secrets.ALIYUN_USER }}
          remote_key: ${{ secrets.ALIYUN_SSH_KEY }}

      # 通知服务器同步静态文件并重启 API
      - name: Run remote deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            # 如果存在代码目录则拉最新代码（用于 API 更新）
            if [ -d /www/pakfront/front ]; then
              cd /www/pakfront/front && git pull
              npm ci --omit=dev 2>/dev/null || true
            fi
            # 重启 API（PM2 守护）
            pm2 restart pak-api --update-env 2>/dev/null || pm2 start /www/pakfront/front/server.mjs --name pak-api --update-env
